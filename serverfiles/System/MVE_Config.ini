[MVES.MapVote]
; Zpracovano pro Map Vote Extended (MVE2i) - https://ut99.org/viewtopic.php?t=15657
; Overte v archivu, ze nazev klientskeho balicku (.u) odpovida hodnote ClientPackage nize (napr. MVE2i)
ClientPackage=MVE2i

; Ponecha ServerPackages rizene z ut99server.ini (neprepise je)
bOverrideServerPackages=False

; Pri prvnim spusteni / restartu automaticky znovu nacte seznam map
bReloadOnNextRun=True

; Casovani hlasovani na konci zapasu (v sekundach)
VoteTimeLimit=45
ScoreBoardDelay=5
bAutoOpen=True
ServerInfoURL=
MapInfoURL=

; ============================================================================
; Herni mody (DeathMatch + CTF, kazdy ve verzi Classic a InstaGib)
; ============================================================================
CustomGame[0]=(bEnabled=True,GameName="DeathMatch",RuleName="Classic",GameClass="Botpack.DeathMatchPlus",FilterCode="dm",bHasRandom=False,VotePriority=1.000000,MutatorList="",Settings="FragLimit=30,TimeLimit=15,bUseTranslocator=False",Packages="",TickRate=0,ServerActors="")
CustomGame[1]=(bEnabled=True,GameName="DeathMatch",RuleName="InstaGib",GameClass="Botpack.DeathMatchPlus",FilterCode="dm",bHasRandom=False,VotePriority=1.000000,MutatorList="Botpack.InstaGibDM",Settings="FragLimit=40,TimeLimit=15,bUseTranslocator=False",Packages="",TickRate=0,ServerActors="")
CustomGame[2]=(bEnabled=True,GameName="Capture the Flag",RuleName="Classic",GameClass="Botpack.CTFGame",FilterCode="ctf",bHasRandom=False,VotePriority=1.000000,MutatorList="",Settings="GoalTeamScore=5,TimeLimit=20,bUseTranslocator=True",Packages="",TickRate=0,ServerActors="")
CustomGame[3]=(bEnabled=True,GameName="Capture the Flag",RuleName="InstaGib",GameClass="Botpack.CTFGame",FilterCode="ctf",bHasRandom=False,VotePriority=1.000000,MutatorList="Botpack.InstaGibDM",Settings="GoalTeamScore=7,TimeLimit=20,bUseTranslocator=False",Packages="",TickRate=0,ServerActors="")

; ============================================================================
; Filtry map (pouze DM-Deck16][ a CTF-Face)
; Pokud budete chtit casem vsechny mapy, zmente na "dm DM-*" a "ctf CTF-*"
; ============================================================================
MapFilters[0]=dm DM-Deck16][
MapFilters[1]=ctf CTF-Face
ExcludeFilters[0]=

